[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerceai"
version = "1.0.0"
description = "Local evidence-based commerce research and experiment workspace"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20", "PyYAML>=6,<7", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/schemas.py" = ["E741"]
"tests/test_domain.py" = ["E741"]
