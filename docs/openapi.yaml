components:
  schemas:
    Assessment:
      properties:
        candidate_id:
          type: string
          title: Candidate Id
        evidence_id:
          type: string
          title: Evidence Id
        reason:
          type: string
          maxLength: 500
          minLength: 1
          title: Reason
        fulfillment_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Fulfillment Score
        quality_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Quality Score
        backup_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Backup Score
        usage_risk_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Usage Risk Score
        differentiation_score:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Differentiation Score
        head_share:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Head Share
        head_share_sample_count:
          type: integer
          minimum: 0.0
          title: Head Share Sample Count
          default: 0
        head_share_precision:
          type: string
          enum:
          - exact
          - lower_bound
          - estimate
          - unknown
          title: Head Share Precision
          default: unknown
        distinct_reviews:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Distinct Reviews
        pain_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pain Verified
        pain_solvable:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Pain Solvable
        bundle_fulfillment_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Bundle Fulfillment Verified
        single_contribution:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Single Contribution
        bundle_contribution:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Bundle Contribution
      additionalProperties: false
      type: object
      required:
      - candidate_id
      - evidence_id
      - reason
      title: Assessment
    AssessmentsUpdate:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        payload:
          $ref: '#/components/schemas/Assessment'
      additionalProperties: false
      type: object
      required:
      - expected_version
      - payload
      title: AssessmentsUpdate
    Body_upload_preview_api_v1_imports_preview_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        source_id:
          type: string
          title: Source Id
        kind:
          type: string
          title: Kind
        sheet:
          type: string
          title: Sheet
          default: ''
      type: object
      required:
      - file
      - source_id
      - kind
      title: Body_upload_preview_api_v1_imports_preview_post
    Candidate:
      properties:
        sku_id:
          type: string
          title: Sku Id
        keyword_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Keyword Id
        primary_offer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Offer Id
        backup_offer_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Backup Offer Id
        note:
          type: string
          title: Note
          default: ''
      additionalProperties: false
      type: object
      required:
      - sku_id
      title: Candidate
    CandidatesUpdate:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        payload:
          $ref: '#/components/schemas/Candidate'
      additionalProperties: false
      type: object
      required:
      - expected_version
      - payload
      title: CandidatesUpdate
    Cashflow:
      properties:
        daily_orders:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Daily Orders
        upfront_cost:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          title: Upfront Cost
        settlement_days:
          type: integer
          minimum: 0.0
          title: Settlement Days
        refund_reserve:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          title: Refund Reserve
        advertising_budget:
          type: string
          pattern: ^\d+(\.\d{1,4})?$
          title: Advertising Budget
      additionalProperties: false
      type: object
      required:
      - daily_orders
      - upfront_cost
      - settlement_days
      - refund_reserve
      - advertising_budget
      title: Cashflow
    CompareInput:
      properties:
        expected_version:
          type: integer
          exclusiveMinimum: 0.0
          title: Expected Version
        supply_id:
          type: string
          maxLength: 500
          minLength: 1
          title: Supply Id
        retail_id:
          type: string
          maxLength: 500
          minLength: 1
          title: Retail Id
        supply_sku:
          type: string
          title: Supply Sku
          default: ''
        retail_sku:
          type: string
          title: Retail Sku
          default: ''
        purchase_quantity:
          type: integer
          maximum: 1000000.0
          exclusiveMinimum: 0.0
          title: Purchase Quantity
          default: 1
        procurement_mode:
          type: string
          enum:
          - STOCK
          - DROPSHIP
          title: Procurement Mode
          default: STOCK
        min_order:
          anyOf:
          - type: integer
            maximum: 1000000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Min Order
        dropship_verified:
          type: boolean
          title: Dropship Verified
          default: false
        supply_pack:
          anyOf:
          - type: integer
            maximum: 100000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Supply Pack
        retail_pack:
          anyOf:
          - type: integer
            maximum: 100000.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Retail Pack
        allow_repack:
          type: boolean
          title: Allow Repack
          default: false
        match_confirmed:
          type: boolean
          title: Match Confirmed
          default: false
        verification_reason:
          type: string
          maxLength: 3000
          title: Verification Reason
          default: ''
        supply_attributes:
          additionalProperties:
            type: string
          type: object
          title: Supply Attributes
        retail_attributes:
          additionalProperties:
            type: string
          type: object
          title: Retail Attributes
        supply_price:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Supply Price
        retail_price:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Retail Price
        retail_shipping:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Retail Shipping
        sale_price:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Sale Price
        inbound_shipping:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Inbound Shipping
        outbound_shipping:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Outbound Shipping
        packaging:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Packaging
        fees:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Fees
        advertising:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Advertising
        refund_rate:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Refund Rate
        refund_loss:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Refund Loss
        ad_budget:
          anyOf:
          - type: string
            pattern: ^\d+(\.\d{1,4})?$
          - type: 'null'
          title: Ad Budget
        region:
          type: string
          maxLength: 500
          minLength: 1
          title: Region
          default: 全国
      additionalProperties: false
      type: object
      required:
      - expected_version
      - supply_id
      - retail_id
      title: CompareInput
    ConnectionInput:
      properties:
        enabled:
          type: boolean
          title: Enabled
          default: true
        api_key:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Api Key
        api_secret:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Api Secret
        access_token:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Access Token
        taobao_route:
          type: string
          enum:
          - tglobal
          - taobao
          title: Taobao Route
          default: tglobal
        platforms:
          items:
            type: string
            enum:
            - '1688'
            - taobao
            - jd
            - pinduoduo
          type: array
          maxItems: 4
          minItems: 1
          title: Platforms
        permission_note:
          type: string
          maxLength: 1000
          title: Permission Note
          default: ''
      additionalProperties: false
      type: object
      title: ConnectionInput
    ConnectionTest:
      properties:
        query:
          type: string
          title: Query
          default: 牙刷
      additionalProperties: false
      type: object
      title: ConnectionTest
    EntityOut:
      properties:
        id:
          type: string
          title: Id
        workspace:
          type: string
          title: Workspace
        kind:
          type: string
          title: Kind
        version:
          type: integer
          title: Version
        data:
          additionalProperties: true
          type: object
          title: Data
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - workspace
      - kind
      - version
      - data
