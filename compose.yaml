name: commerceai
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://commerceai:${POSTGRES_PASSWORD:?run scripts/setup.py first}@db:5432/commerceai
    OWNER_PASSWORD: ${OWNER_PASSWORD:?run scripts/setup.py first}
    DATA_DIR: /app/storage
  volumes: [evidence:/app/storage]
  depends_on:
    db: {condition: service_healthy}
  restart: unless-stopped
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerceai
      POSTGRES_USER: commerceai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.py first}
    volumes: [postgres:/var/lib/postgresql/data]
    command: [postgres, -c, shared_buffers=128MB, -c, work_mem=4MB, -c, maintenance_work_mem=64MB, -c, max_connections=20]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U commerceai -d commerceai]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    command: [sh, -c, 'alembic upgrade head && python -m app.seed && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1']
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: [python, -m, app.worker]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:${PORT:-8080}:80"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
volumes:
  postgres:
  evidence:
